name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Opens (and keeps up to date) a "release" PR with the version bump and CHANGELOG computed from the
      # Conventional Commits on main. Merging it creates the tag (vX.Y.Z) and the GitHub Release.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
